# 名字决定部署后的 *.workers.dev 域名：改名等于换一个新地址，旧 worker 会留在
# Cloudflare 面板里，可自行删除。Cloudflare 只接受小写，所以这里写 sonora。
name = "sonora"
main = "index.js"
# 运行时的行为按这个日期解释，建议别落后一个版本以上
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[env.production]
name = "sonora"

[env.staging]
name = "sonora-staging"

# 可观测性：每次部署默认开启 Workers Logs（含 invocation 日志 + console.log / 未捕获异常）
# head_sampling_rate：1 = 每条请求都记（默认也是 1）；流量大想省点就调成 0.1 之类
# 需要 wrangler >= 3.78.6
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# 运行时放置：让 Worker 跑在离后端最近的数据中心（Beta）
# 后端是微软的 *.tts.speech.microsoft.com，所以贴 Azure 东南亚；
# region 与 mode = "smart" 互斥，只能二选一；区域格式 {provider}:{region}
[placement]
region = "azure:southeastasia"

# 变量配置（如果需要的话）
[vars]
# 可以在这里添加环境变量

# 如果需要 KV 存储（可选）
# [[kv_namespaces]]
# binding = "MY_KV_NAMESPACE"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"

# 如果需要 D1 数据库（可选）
# [[d1_databases]]
# binding = "DB"
# database_name = "my-database"
# database_id = "your-database-id"

# 路由配置
[triggers]
crons = []

